name: PR Review

on:
  pull_request:
    types: [labeled]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Reviews are opt-in: only adding the `to-review` label starts one, so a
    # push to an open PR no longer spends ~$2.50 unasked.
    #
    # This guard is also what stops the workflow re-triggering itself. The
    # final step adds `reviewed`, which raises a second `labeled` event on the
    # same PR; the name check drops it. Widening this condition (or reacting to
    # `unlabeled`) reintroduces a loop that bills per iteration.
    if: >-
      github.event.label.name == 'to-review'
      && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pr-reviewer
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 40
            --allowedTools "Task,Read,Grep,Glob,Bash,WebFetch"
          prompt: |
            You are running in GitHub Actions on a pull_request event for
            PR #${{ github.event.pull_request.number }} in this repository.
            The repo is already checked out at the exact PR head commit
            (${{ github.event.pull_request.head.sha }}), not a synthetic
            merge commit — do not `git checkout` a different ref or run
            `gh pr checkout`.

            Use the Task tool to invoke the `pr-reviewer` subagent to
            review this PR's changes against the base branch
            `${{ github.event.pull_request.base.ref }}`.

            Once the subagent reports its findings, post them as a single
            comment on PR #${{ github.event.pull_request.number }} using
            the gh CLI (already authenticated via the GH_TOKEN env var):
            write the findings to a temp file, then run
            `gh pr comment ${{ github.event.pull_request.number }} --body-file <path>`.

            If the subagent finds nothing blocking, still post a short
            comment saying the review ran and found no issues, so it's
            clear the check executed rather than silently doing nothing.

      # No `if:` — a step defaults to `success()`, so a review that errored or
      # was cancelled never gets labelled `reviewed`. The label means findings
      # were posted, not merely that the workflow fired.
      #
      # `--repo` is explicit on purpose: every `gh` subcommand fills unspecified
      # context from ambient state rather than erroring, and this repo has been
      # bitten by that twice (docs/TROUBLESHOOTING.md, the `gh release create`
      # and `gh pr create --head` entries).
      - name: Mark as reviewed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh pr edit ${{ github.event.pull_request.number }}
          --repo ${{ github.repository }}
          --add-label reviewed

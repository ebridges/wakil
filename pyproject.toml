[project]
name = "wakil"
dynamic = ["version"]
description = "Local-first CLI agent for a personal Markdown knowledge base"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "anthropic>=0.116.0",
    "httpx>=0.28.1",
    "readability-lxml>=0.8.4.1",
    "beautifulsoup4>=4.15.0",
    "alembic>=1.18.5",
]

[project.scripts]
wakil = "wakil.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wakil"]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eval: live-model skill evaluations (real API calls; excluded by default, run with -m eval)"]
addopts = "-m 'not eval'"
